version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # lucide-react 1.x removeu os ícones de marca (Github, Linkedin, Instagram)
      # usados no site. Remova esta regra só depois de migrar esses ícones.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
